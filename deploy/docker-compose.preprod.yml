name: glitch-preprod

networks:
  traefik-public:
    external: true

services:
  api:
    image: ghcr.io/samyleedev/glitch-api:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glitch-api-preprod.rule=Host(`preprod-api.glitch.samyleedev.fr`)"
      - "traefik.http.routers.glitch-api-preprod.entrypoints=websecure"
      - "traefik.http.routers.glitch-api-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.glitch-api-preprod.loadbalancer.server.port=3000"

  web:
    image: ghcr.io/samyleedev/glitch-web:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glitch-web-preprod.rule=Host(`preprod.glitch.samyleedev.fr`)"
      - "traefik.http.routers.glitch-web-preprod.entrypoints=websecure"
      - "traefik.http.routers.glitch-web-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.glitch-web-preprod.loadbalancer.server.port=3000"