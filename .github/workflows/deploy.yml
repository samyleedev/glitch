name: Deploy glitch

on:
  push:
    branches: [preprod]
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  validate:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api (validation only, pas de push)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
      - name: Build web (validation only, pas de push)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false

  build-and-deploy-preprod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-latest
    environment: preprod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/samyleedev/glitch-api:${{ github.sha }}

      - name: Build et push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ghcr.io/samyleedev/glitch-web:${{ github.sha }}

      - name: Copier le docker-compose sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.preprod.yml"
          target: "/opt/glitch/preprod"
          strip_components: 1

      - name: Déployer sur preprod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/glitch/preprod
            mv docker-compose.preprod.yml docker-compose.yml
            cat > .env << 'ENVEOF'
            IMAGE_TAG=${{ github.sha }}
            CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
            ENVEOF
            docker compose pull
            docker compose up -d

  deploy-prod:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copier le docker-compose sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/glitch/prod"
          strip_components: 1

      - name: Déployer sur prod (même image, aucun rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/glitch/prod
            mv docker-compose.prod.yml docker-compose.yml
            cat > .env << 'ENVEOF'
            IMAGE_TAG=${{ github.event.pull_request.head.sha }}
            CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
            ENVEOF
            docker compose pull
            docker compose up -d
